# Funder wallet for the all-in-one Railway service. Loopback-only RPC/health:
# only the gateway, bootstrap job, and API (all in this container) talk to it.
# The datadir is on the single /data volume.

network = "regtest"
datadir = "/data/funder"
default_wallet = "default"

[wallets.default]
dir = "/data/funder/default"

[pools]
enabled = ["sapling", "orchard"]
default_receivers = ["orchard"]
transparent = true

[backend]
server = "zebra://127.0.0.1:18234"
connect_timeout_secs = 5
reconnect_base_secs = 1
reconnect_max_secs = 2

[rpc]
bind = "127.0.0.1"
port = 18242
user = "funder"
password = "regtest-funder-pw"
allow_duplicate_shielded_recipients = true

[keys]
auto_unlock = true

[sync]
interval_secs = 2
rebroadcast_secs = 2

[health]
enabled = true
bind = "127.0.0.1"
port = 9243

# The harness's funder depths: z_shieldcoinbase yields a single note with no
# change, and the harness owns the chain (no reorg risk).
[spend]
trusted_confirmations = 1
untrusted_confirmations = 1
