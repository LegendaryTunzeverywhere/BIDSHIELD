# Auctioneer escrow wallet for the all-in-one Railway service. Loopback-only
# RPC/health; the datadir is on the single /data volume. Stock confirmation
# policy (no [spend] overrides), same as the split-service deployment.

network = "regtest"
datadir = "/data/auctioneer"
default_wallet = "default"

[wallets.default]
dir = "/data/auctioneer/default"

[backend]
server = "zebra://127.0.0.1:18234"
connect_timeout_secs = 10
reconnect_base_secs = 1
reconnect_max_secs = 60

[rpc]
bind = "127.0.0.1"
port = 18232
user = "auctioneer"
password = "regtest-auctioneer-pw"
allow_duplicate_shielded_recipients = true

[keys]
auto_unlock = true

[sync]
interval_secs = 5

[health]
enabled = true
bind = "127.0.0.1"
port = 9233
